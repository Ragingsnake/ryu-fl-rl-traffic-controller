version: '3.8'

services:
  web-demo:
    build:
      context: ..
      dockerfile: app/Dockerfile
    container_name: fl-rl-traffic-web-demo
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - ../results:/workspace/results
      - ../models:/workspace/models
      - ../data:/workspace/data
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
