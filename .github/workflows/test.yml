name: Evaluation Demo Benchmark

on:
  workflow_dispatch:
    inputs:
      topology:
        description: 'Topology to benchmark (all, nsfnet, geant, abilene)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - nsfnet
          - geant
          - abilene

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint and Format Check with ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Run unit tests with pytest
      run: |
        pytest tests/ -v

    - name: Run Evaluation Demo Across Scenarios & Seeds
      run: |
        python scripts/demo.py --topology ${{ inputs.topology || 'all' }} --no_random --seeds 42 --out_dir results/demo

    - name: Upload Demo Results Artifact
      uses: actions/upload-artifact@v4
      with:
        name: demo-evaluation-results
        path: |
          results/demo/**/*.png
        if-no-files-found: ignore
        retention-days: 14
