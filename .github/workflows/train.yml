name: Train & Commit Model

on:
  workflow_dispatch:
    inputs:
      rl_timesteps:
        description: 'Total timesteps to train PPO RL agent'
        required: true
        default: '200000'
        type: string
      fl_rounds:
        description: 'Number of Federated Learning (FL) rounds'
        required: true
        default: '20'
        type: string

jobs:
  train-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate Traffic Data & Preprocess
      run: |
        python data/generate_tm.py
        python data/preprocess.py

    - name: Train Federated Learning (FL) Model
      run: |
        python fl/train_fl.py --rounds ${{ inputs.fl_rounds }}

    - name: Train Reinforcement Learning (RL) PPO Agent
      run: |
        python rl/train_rl.py --timesteps ${{ inputs.rl_timesteps }}

    - name: Commit and Push Updated Models
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f models/ppo_agent.zip models/fl_global_model.pt
        if git diff --staged --quiet; then
          echo "No model changes detected to commit."
        else
          git commit -m "chore(models): retrain FL (${{ inputs.fl_rounds }} rds) & RL (${{ inputs.rl_timesteps }} steps) [skip ci]"
          git push origin main
        fi
