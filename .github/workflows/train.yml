name: Train & Commit Model

on:
  workflow_dispatch:
    inputs:
      topology:
        description: 'Network topology to train (nsfnet, geant, abilene)'
        required: true
        default: 'nsfnet'
        type: choice
        options:
          - nsfnet
          - geant
          - abilene
      rl_timesteps:
        description: 'Total timesteps to train PPO RL agent'
        required: true
        default: '102400'
        type: string
      use_recurrent:
        description: 'Use RecurrentPPO (MlpLstmPolicy) to eliminate route flapping?'
        required: false
        default: true
        type: boolean
      train_fl:
        description: 'Retrain Federated Learning (FL) model before RL training?'
        required: false
        default: false
        type: boolean
      fl_rounds:
        description: 'Number of FL rounds (only used if train_fl is checked)'
        required: false
        default: '20'
        type: string

jobs:
  train-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate Traffic Data & Preprocess
      run: |
        python data/generate_tm.py --topology ${{ inputs.topology }}
        python data/preprocess.py --topology ${{ inputs.topology }}

    - name: Train Federated Learning (FL) Model
      if: ${{ inputs.train_fl == true }}
      run: |
        python fl/train_fl.py --topology ${{ inputs.topology }} --rounds ${{ inputs.fl_rounds }}

    - name: Train Reinforcement Learning (RL) Agent
      run: |
        ARGS="--topology ${{ inputs.topology }} --timesteps ${{ inputs.rl_timesteps }}"
        if [ "${{ inputs.use_recurrent }}" = "true" ]; then
          ARGS="$ARGS --recurrent"
        fi
        python rl/train_rl.py $ARGS

    - name: Commit and Push Updated Models
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f models/ppo_agent*.zip models/fl_global_model*.pt
        if git diff --staged --quiet; then
          echo "No model changes detected to commit."
        else
          git commit -m "chore(models): retrain ${{ inputs.topology }} RL (${{ inputs.rl_timesteps }} steps) [skip ci]"
          git push origin main
        fi
