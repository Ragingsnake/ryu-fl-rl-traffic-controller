name: Stop Azure VM (controller)

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: 'Resource Group name'
        required: true
        default: 'ryu-rg'
      vm_name:
        description: 'Virtual Machine name'
        required: true
        default: 'controller'

jobs:
  stop-vm:
    name: Stop & Deallocate Controller VM
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Stop & Deallocate VM (Save Compute Costs)
        run: |
          echo "Deallocating VM '${{ inputs.vm_name }}' in resource group '${{ inputs.resource_group }}'..."
          az vm deallocate --resource-group "${{ inputs.resource_group }}" --name "${{ inputs.vm_name }}"

      - name: Verify Power State
        run: |
          STATUS=$(az vm get-instance-view --resource-group "${{ inputs.resource_group }}" --name "${{ inputs.vm_name }}" --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus" -o tsv)
          echo "=========================================================="
          echo "  VM Name:        ${{ inputs.vm_name }}"
          echo "  Resource Group: ${{ inputs.resource_group }}"
          echo "  Power State:    $STATUS"
          echo "=========================================================="
          echo "VM successfully deallocated. Compute billing has stopped."
