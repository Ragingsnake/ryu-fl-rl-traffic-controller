hostname r11
password zebra
enable password zebra
log file /tmp/frr-r11-ospfd.log
router ospf
 ospf router-id 10.255.0.11
 passive-interface default
 no passive-interface r11-eth0
 no passive-interface r11-eth1
 no passive-interface r11-eth2
 network 10.0.0.52/30 area 0.0.0.0
 network 10.0.0.64/30 area 0.0.0.0
 network 10.0.0.72/30 area 0.0.0.0
 network 192.168.11.0/24 area 0.0.0.0
