 no passive-interface r12-eth2
 network 10.0.0.60/30 area 0.0.0.0
 network 10.0.0.72/30 area 0.0.0.0
 network 10.0.0.80/30 area 0.0.0.0
 network 192.168.12.0/24 area 0.0.0.0
