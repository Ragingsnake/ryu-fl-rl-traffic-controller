 no passive-interface r2-eth2
 network 10.0.0.0/30 area 0.0.0.0
 network 10.0.0.12/30 area 0.0.0.0
 network 10.0.0.16/30 area 0.0.0.0
 network 192.168.2.0/24 area 0.0.0.0
